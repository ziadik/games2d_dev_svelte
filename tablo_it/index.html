<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="favicon.ico" type="image/x-icon">
<title>Табло Аэропорта | Live API</title>
<style>
  /* CSS Переменные */
  :root {
    --bg-color: #050508;
    --board-bg-top: #0f0f16;
    --board-bg-bottom: #08080c;
    --text-color: #e8c84a;
    --text-shadow: rgba(232, 200, 74, 0.4);
    --flap-bg: #1a1a24;
    --flap-cell-bg: #15151e;
    
    /* Динамические переменные размеров */
    --cell-width: 16px;
    --cell-height: 24px;
    --cell-font-size: 22px;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg-color);
    color: var(--text-color);
    font-family: 'Courier New', Courier, monospace;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 10px;
    overflow-x: hidden;
    transition: background 0.3s;
  }

  .board {
    width: 100%;
    max-width: 1400px;
    background: linear-gradient(180deg, var(--board-bg-top) 0%, var(--board-bg-bottom) 100%);
    border: 1px solid #2a2a35;
    border-radius: 4px;
    padding: 12px;
    box-shadow: 0 0 40px rgba(0,0,0,0.8), inset 0 0 80px rgba(0,0,0,0.9);
    position: relative;
    transition: background 0.3s;
  }

  .board::before {
    content: " ";
    display: block;
    position: absolute;
    top: 0; left: 0; bottom: 0; right: 0;
    background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
    z-index: 10;
    background-size: 100% 2px, 3px 100%;
    pointer-events: none;
    opacity: 0.6;
    border-radius: 4px;
  }

  /* Кнопка настроек (СЛЕВА) */
  .settings-btn {
    position: absolute;
    top: 40px;
    left: 10px;
    z-index: 20;
    background: rgba(0,0,0,0.5);
    border: 1px solid var(--text-color);
    color: var(--text-color);
    cursor: pointer;
    padding: 4px 10px;
    border-radius: 10px;
    font-size: 34px;
    opacity: 0.5;
    transition: opacity 0.3s;
  }
  .settings-btn:hover { opacity: 1; }

  /* Модальное окно настроек */
  .settings-modal {
    display: none;
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    background: #1a1a24;
    border: 1px solid #444;
    padding: 20px;
    z-index: 100;
    border-radius: 8px;
    box-shadow: 0 0 20px rgba(0,0,0,0.9);
    color: #fff;
    width: 320px;
    max-height: 90vh;
    overflow-y: auto;
  }
  .settings-modal.active { display: block; }
  .settings-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.7);
    z-index: 99;
  }
  .settings-overlay.active { display: block; }

  .setting-row { margin-bottom: 15px; }
  .setting-row label { display: block; margin-bottom: 5px; font-size: 14px; display: flex; justify-content: space-between; }
  .setting-row input[type="range"] { width: 100%; cursor: pointer; }
  .setting-row input[type="color"] { width: 100%; height: 30px; border: none; cursor: pointer; }
  
  .close-settings {
    background: #333; color: white; border: none; padding: 5px 10px; cursor: pointer; float: right;
  }

  /* Верхняя панель с часами и погодой */
  .top-panel {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    margin-bottom: 12px;
    padding-right: 5px;
    padding-left: 50px; /* Отступ под кнопку настроек */
  }

  .datetime-header {
    font-size: 40px;
    letter-spacing: 3px;
    color: var(--text-color);
    text-shadow: 0 0 4px var(--text-shadow);
    font-weight: bold;
  }

  .weather-widget {
    display: flex;
    align-items: center;
    gap: 15px;
    font-size: 40px;
    color: #b8a83a;
    text-shadow: 0 0 4px rgba(184, 168, 58, 0.3);
  }
  
  .weather-temp {
    font-weight: bold;
    font-size: 60px;
  }

  .col-headers {
    /* ИЗМЕНЕНО: auto для колонок с ячейками, чтобы они растягивались по контенту */
    display: grid;
    grid-template-columns: 40px auto 1fr auto auto 2fr; 
    gap: 3px;
    margin-bottom: 5px;
    border-bottom: 2px solid #333;
    padding-bottom: 3px;
    align-items: center;
  }
  .col-headers span {
    font-size: 18px;
    letter-spacing: 1px;
    color: #b8a83a;
    text-transform: uppercase;
    text-align: center;
    font-weight: bold;
    padding: 0 2px;
  }

  .section-divider {
    margin: 8px 0 3px 0;
    padding: 2px 5px;
    background: var(--flap-cell-bg);
    border-left: 3px solid var(--text-color);
    font-size: 23px;
    font-weight: bold;
    letter-spacing: 2px;
    color: #b8a83a;
    text-transform: uppercase;
    box-shadow: 0 2px 8px rgba(0,0,0,0.5);
  }

  .flights {
    display: flex;
    flex-direction: column;
  }

  .flight-row {
    /* ИЗМЕНЕНО: auto для колонок с ячейками */
    display: grid;
    grid-template-columns: 40px auto 1fr auto auto 2fr;
    gap: 15px;
    align-items: center;
  }

  .airline-logo {
    display: flex;
    align-items: center;
    justify-content: center;
    height: var(--cell-height);
    width: 50px;
  }
  
  .airline-logo img {
    max-height: var(--cell-height);
    max-width: 46px;
    object-fit: contain;
    filter: drop-shadow(0 0 2px var(--text-shadow));
  }

  .flap-cell {
    position: relative;
    height: var(--cell-height);
    width: var(--cell-width);
    perspective: 300px;
    background: var(--flap-cell-bg);
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    min-width: 10px; 
    min-height: 14px;
  }

  .flap-char {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: var(--cell-font-size);
    font-weight: bold;
    color: var(--text-color);
    background: var(--flap-bg);
    backface-visibility: hidden;
    text-shadow: 0 0 3px var(--text-shadow);
    overflow: hidden;
    box-shadow: inset 0 -1px 0 rgba(0,0,0,0.5);
  }

  .flap-char::after {
    content: '';
    position: absolute;
    left: 0; right: 0;
    top: 50%;
    height: 1px;
    background: rgba(0,0,0,0.6);
    z-index: 2;
  }

  .flap-char.spinning {
    color: #fff;
    text-shadow: 0 0 6px rgba(255,255,255,0.8);
  }

  /* ── СТАТУС (Бегущая строка) ────────────── */
  .status-container {
    height:  var(--cell-height);
    overflow: hidden;
    white-space: nowrap;
    position: relative;
    background: var(--flap-cell-bg);
    border-radius: 2px;
    display: flex;
    align-items: center;
  }

  .marquee-wrapper {
    display: flex;
    white-space: nowrap;
    will-change: transform;
  }

  .status-text {
    font-size: var(--cell-font-size);
    font-weight: bold;
    color: var(--text-color);
    text-shadow: 0 0 3px var(--text-shadow);
    padding-right: 50px;
    display: inline-block;
  }

  @keyframes scroll-infinite {
    0% { transform: translateX(0); }
    100% { transform: translateX(-50%); }
  }

  .scrolling .marquee-wrapper {
    animation: scroll-infinite 15s linear infinite;
  }

  .conn-status {
    position: absolute;
    top: 12px;
    left: 12px;
    font-size: 10px;
    color: #555;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .conn-status.online { color: #4a8; text-shadow: 0 0 4px rgba(68,170,136,0.5); }
  .conn-status.offline { color: #a44; text-shadow: 0 0 4px rgba(170,68,68,0.5); }

  .footer {
    margin-top: 20px;
    padding-top: 15px;
    border-top: 1px solid #2a2a35;
    text-align: center;
    color: #888;
    font-size: 12px;
  }

  .footer .copyright { margin: 0; font-size: 12px; }
  .footer a { color: white; text-decoration: none; transition: opacity 0.3s; }
  .footer a:hover { opacity: 0.7; text-decoration: underline; }

  @media (max-width: 800px) {
    .board { padding: 8px; border-radius: 0; border-left: none; border-right: none; }
    
    .top-panel {
        flex-direction: column-reverse;
        align-items: center;
        gap: 10px;
        padding-left: 0;
    }
    
    .weather-widget { font-size: 18px; }
    .weather-temp { font-size: var(--cell-font-size); }

    .col-headers { display: none; }

    .flight-row {
      display: grid !important;
      grid-template-columns: 30px 42px 1fr 65px !important;
      gap: 3px !important;
      margin-bottom: 4px;
      border-bottom: 1px solid #1a1a24;
      padding-bottom: 4px;
    }

    .flight-row > div:nth-child(4),
    .flight-row > div:nth-child(5) {
      display: none !important;
    }

    .airline-logo { height: 22px !important; width: 30px !important; }
    .airline-logo img { max-height: 20px !important; max-width: 28px !important; }
    
    .datetime-header { font-size: var(--cell-font-size); text-align: center; letter-spacing: 2px; }
    .conn-status { position: static; text-align: center; margin-bottom: 8px; display: block; }
    .section-divider { font-size: 21px; padding: 2px 4px; margin: 8px 0 2px 0; }
    .footer { margin-top: 15px; padding-top: 10px; font-size: 10px; }
    .footer .copyright { font-size: 10px; }
  }

  @media (max-width: 380px) {
    .flight-row { grid-template-columns: 25px 36px 1fr 55px !important; }
    .airline-logo { height: 19px !important; width: 25px !important; }
    .airline-logo img { max-height: 17px !important; max-width: 23px !important; }
  }
</style>
</head>
<body>

<!-- Оверлей и модальное окно настроек -->
<div class="settings-overlay" id="settingsOverlay"></div>
<div class="settings-modal" id="settingsModal">
  <button class="close-settings" id="closeSettings">✕</button>
  <h3 style="margin-bottom: 15px; border-bottom: 1px solid #444; padding-bottom: 5px;">Настройки вида</h3>
  
  <!-- Основные настройки -->
  <div class="setting-row">
    <label>Размер шрифта <span id="fontSizeVal">22px</span></label>
    <input type="range" id="fontSizeRange" min="10" max="50" value="22">
  </div>

  <div class="setting-row">
    <label>Жирность шрифта <span id="fontWeightVal">700</span></label>
    <input type="range" id="fontWeightRange" min="100" max="900" step="100" value="700">
  </div>

  <div class="setting-row">
    <label>Цвет букв</label>
    <input type="color" id="textColorPicker" value="#e8c84a">
  </div>

  <div class="setting-row">
    <label>Цвет фона</label>
    <input type="color" id="bgColorPicker" value="#050508">
  </div>

  <hr style="border: 0; border-top: 1px solid #444; margin: 15px 0;">
  <h4 style="margin-bottom: 10px;">Размеры ячеек (Flaps)</h4>

  <div class="setting-row">
    <label>Ширина ячейки <span id="cellWidthVal">16px</span></label>
    <input type="range" id="cellWidthRange" min="10" max="40" value="16">
  </div>

  <div class="setting-row">
    <label>Высота ячейки <span id="cellHeightVal">24px</span></label>
    <input type="range" id="cellHeightRange" min="14" max="60" value="24">
  </div>
  
  <button onclick="resetSettings()" style="width:100%; padding: 5px; background: #552222; color: white; border: none; cursor: pointer; margin-top: 10px;">Сбросить настройки</button>
</div>

<div class="board" id="board">
  <button class="settings-btn" id="openSettings">⚙</button>
  <div class="conn-status offline" id="connStatus">OFFLINE</div>
  
  <!-- Верхняя панель: Часы и Погода -->
  <div class="top-panel">
      <div class="weather-widget" id="weather">
          <span>--°C</span>
          <span style="font-size: 0.6em; opacity: 0.8;">--</span>
      </div>
      <div class="datetime-header" id="datetime">--.--.-- --:--:--</div>
  </div>

  <div class="col-headers">
    <span></span>
    <span>Время</span>
    <span>Направление</span>
    <span>Рейс</span>
    <span>Терм./Ст.</span>
    <span>Статус</span>
  </div>

  <div class="flights" id="flights"></div>

  <div class="footer">
    <p class="copyright">© 2026 ООО «ААА»</p>
    <p style="margin-top: 5px; font-size: 0.75rem; opacity: 0.8;">
      Разработка сайта: <a href="https://ziidik.ru" target="_blank" style="color: white;">VARTA_DEV</a>
    </p>
  </div>
</div>

<script>
const API_BASE = 'http://172.17.0.19:3002';
const URL_DEP = `${API_BASE}/get/xalTabloDU`;
const URL_ARR = `${API_BASE}/get/xalTabloAR`;
const URL_LIVERIES = `${API_BASE}/getImageAll`;
const URL_WEATHER = 'http://172.17.0.19:3025/getTemp'; 

const REFRESH_INTERVAL = 3600000; 
const RETRY_DELAY = 5000;

// Количество символов в колонках
const COL_WIDTHS = { time:5, dest:12, flight:7, gate:3 }; 
const CHARS = "АБВГДЕЁЖЗИЙКЛМНОПРСТУФХЦЧШЩЪЫЬЭЮЯABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789-:., ";

let liveriesCache = new Map();
let previousFlightsData = null; 

// --- ЛОГИКА НАСТРОЕК ---
const settings = {
  fontSize: localStorage.getItem('tablo_fontSize') || 22,
  fontWeight: localStorage.getItem('tablo_fontWeight') || 700, // Исправлено default на 700
  textColor: localStorage.getItem('tablo_textColor') || '#e8c84a',
  bgColor: localStorage.getItem('tablo_bgColor') || '#050508',
  cellWidth: localStorage.getItem('tablo_cellWidth') || 16,
  cellHeight: localStorage.getItem('tablo_cellHeight') || 24
};

function applySettings() {
  const r = document.querySelector(':root');
  r.style.setProperty('--text-color', settings.textColor);
  r.style.setProperty('--bg-color', settings.bgColor);
  
  // Применяем настройки ячеек
  r.style.setProperty('--cell-width', settings.cellWidth + 'px');
  r.style.setProperty('--cell-height', settings.cellHeight + 'px');
  
  // Шрифт теперь единый для всего табло (и ячеек, и текста)
  r.style.setProperty('--cell-font-size', settings.fontSize + 'px');
  
  // Обновляем инпуты и лейблы
  document.getElementById('fontSizeRange').value = settings.fontSize;
  document.getElementById('fontSizeVal').textContent = settings.fontSize + 'px';
  
  document.getElementById('fontWeightRange').value = settings.fontWeight;
  document.getElementById('fontWeightVal').textContent = settings.fontWeight;
  
  document.getElementById('textColorPicker').value = settings.textColor;
  document.getElementById('bgColorPicker').value = settings.bgColor;

  document.getElementById('cellWidthRange').value = settings.cellWidth;
  document.getElementById('cellWidthVal').textContent = settings.cellWidth + 'px';
  
  document.getElementById('cellHeightRange').value = settings.cellHeight;
  document.getElementById('cellHeightVal').textContent = settings.cellHeight + 'px';

  // Применяем стили ко всем существующим элементам (для мгновенного обновления без перезагрузки)
  document.querySelectorAll('.flap-char, .status-text').forEach(el => {
    el.style.fontSize = settings.fontSize + 'px';
    el.style.fontWeight = settings.fontWeight;
  });
}

function saveSetting(key, value) {
  settings[key] = value;
  localStorage.setItem('tablo_' + key, value);
  applySettings();
}

function resetSettings() {
  localStorage.clear();
  location.reload();
}

// Слушатели событий настроек
document.getElementById('openSettings').onclick = () => {
  document.getElementById('settingsModal').classList.add('active');
  document.getElementById('settingsOverlay').classList.add('active');
};
document.getElementById('closeSettings').onclick = () => {
  document.getElementById('settingsModal').classList.remove('active');
  document.getElementById('settingsOverlay').classList.remove('active');
};
document.getElementById('settingsOverlay').onclick = () => {
  document.getElementById('settingsModal').classList.remove('active');
  document.getElementById('settingsOverlay').classList.remove('active');
};

// Привязка ползунков
document.getElementById('fontSizeRange').oninput = (e) => saveSetting('fontSize', e.target.value);
document.getElementById('fontWeightRange').oninput = (e) => saveSetting('fontWeight', e.target.value);
document.getElementById('textColorPicker').oninput = (e) => saveSetting('textColor', e.target.value);
document.getElementById('bgColorPicker').oninput = (e) => saveSetting('bgColor', e.target.value);
document.getElementById('cellWidthRange').oninput = (e) => saveSetting('cellWidth', e.target.value);
document.getElementById('cellHeightRange').oninput = (e) => saveSetting('cellHeight', e.target.value);

// Применяем настройки при загрузке
applySettings();


class FlapChar {
  constructor() {
    this.el = document.createElement('div');
    this.el.className = 'flap-cell';
    this.inner = document.createElement('div');
    this.inner.className = 'flap-char';
    this.inner.textContent = ' ';
    
    // ВАЖНО: Принудительно применяем текущие настройки к новому элементу,
    // чтобы они не сбрасывались при обновлении данных
    this.inner.style.fontSize = settings.fontSize + 'px';
    this.inner.style.fontWeight = settings.fontWeight;

    this.el.appendChild(this.inner);
    this.currentVal = ' ';
    this.isSpinning = false;
  }

  spinTo(targetChar) {
    if (this.currentVal === targetChar && !this.isSpinning) return;
    this.isSpinning = true;
    this.inner.classList.add('spinning');
    let iterations = 0;
    const maxIterations = 3 + Math.floor(Math.random() * 5);
    const interval = setInterval(() => {
      this.inner.textContent = CHARS[Math.floor(Math.random() * CHARS.length)];
      iterations++;
      if (iterations >= maxIterations) {
        clearInterval(interval);
        this.inner.textContent = targetChar;
        this.inner.classList.remove('spinning');
        this.currentVal = targetChar;
        this.isSpinning = false;
      }
    }, 45);
  }

  get element() { return this.el; }
}

let currentRows = [];
let isOnline = false;
let retryTimeout = null;
let refreshInterval = null;

window.addEventListener('online', handleNetworkChange);
window.addEventListener('offline', handleNetworkChange);

function handleNetworkChange() {
  const statusEl = document.getElementById('connStatus');
  if (navigator.onLine) {
    statusEl.textContent = 'RECONNECTING...';
    statusEl.className = 'conn-status offline';
    clearTimeout(retryTimeout);
    fetchAndRender();
  } else {
    statusEl.textContent = 'OFFLINE';
    statusEl.className = 'conn-status offline';
    isOnline = false;
    if (refreshInterval) { clearInterval(refreshInterval); refreshInterval = null; }
  }
}

async function loadLiveries() {
  try {
    const response = await fetch(URL_LIVERIES);
    if (!response.ok) throw new Error('Failed to load liveries');
    const data = await response.json();
    liveriesCache.clear();
    data.forEach(item => {
      if (item.IATACODE && item.IMAGEB64TAIL) {
        const imageUrl = `data:image/png;base64,${item.IMAGEB64TAIL}`;
        liveriesCache.set(item.IATACODE.toUpperCase(), imageUrl);
      }
    });
  } catch (err) { console.error('Ошибка загрузки ливрей:', err); }
}

async function loadWeather() {
    try {
        const response = await fetch(URL_WEATHER);
        if (!response.ok) throw new Error('Weather API error');
        const data = await response.json();
        
        if (data.weather) {
            const temp = data.weather.temperature;
            const desc = data.metaDescription || data.weather.airportName || '';
            
            const weatherEl = document.getElementById('weather');
            if (weatherEl) {
                weatherEl.innerHTML = `
                    <span class="weather-temp">${temp}°C</span>
                    <span style="font-size: 0.5em; opacity: 0.9; text-transform: uppercase;">${desc}</span>
                `;
            }
        }
    } catch (err) {
        console.error('Ошибка загрузки погоды:', err);
    }
}

function getLiveryUrl(companyCode) {
  if (!companyCode) return null;
  return liveriesCache.get(companyCode.toUpperCase().trim()) || null;
}

function createRowElement() {
  const row = document.createElement('div');
  row.className = 'flight-row';

  const logoDiv = document.createElement('div');
  logoDiv.className = 'airline-logo';
  row.appendChild(logoDiv);

  const cols = ['time','dest','flight','gate'];
  const rowChars = {};

  cols.forEach(col => {
    const colDiv = document.createElement('div');
    colDiv.style.display = 'flex';
    colDiv.style.gap = '1px'; 
    const width = COL_WIDTHS[col];
    const chars = [];
    for (let i = 0; i < width; i++) {
      const fc = new FlapChar();
      colDiv.appendChild(fc.element);
      chars.push(fc);
    }
    row.appendChild(colDiv);
    rowChars[col] = chars;
  });

  const statusContainer = document.createElement('div');
  statusContainer.className = 'status-container';
  
  const marqueeWrapper = document.createElement('div');
  marqueeWrapper.className = 'marquee-wrapper';
  
  const text1 = document.createElement('span');
  text1.className = 'status-text';
  // Применяем настройки к статусу сразу при создании
  text1.style.fontSize = settings.fontSize + 'px';
  text1.style.fontWeight = settings.fontWeight;
  
  const text2 = document.createElement('span');
  text2.className = 'status-text';
  text2.style.fontSize = settings.fontSize + 'px';
  text2.style.fontWeight = settings.fontWeight;
  
  marqueeWrapper.appendChild(text1);
  marqueeWrapper.appendChild(text2);
  statusContainer.appendChild(marqueeWrapper);
  
  row.appendChild(statusContainer);

  return { el: row, chars: rowChars, logo: logoDiv, statusWrap: marqueeWrapper };
}

function updateLogo(logoDiv, companyCode) {
  const imageUrl = getLiveryUrl(companyCode);
  const existingImg = logoDiv.querySelector('img');
  if (existingImg && existingImg.src === imageUrl) return;

  logoDiv.innerHTML = '';
  if (imageUrl) {
    const img = document.createElement('img');
    img.src = imageUrl;
    img.alt = companyCode || '';
    logoDiv.appendChild(img);
  }
}

function parseDestination(destStr) {
  if (!destStr) return 'НЕИЗВЕСТНО'.padEnd(COL_WIDTHS.dest, ' ');
  return destStr.split('%')[0].toUpperCase().padEnd(COL_WIDTHS.dest, ' ');
}

function getStatusDep(flight) {
  let parts = [];
  if (flight.timedelay && flight.time !== flight.timedelay) {
    let delayText = flight.codedelay ? flight.codedelay.replace(/[^а-яА-Яa-zA-Z0-9\s]/g, '').trim() : 'Задержан';
    if (delayText.toLowerCase().includes('поздн')) delayText = "Позднее прибытие";
    parts.push(`${delayText} | Задержан до ${flight.timedelay}`);
  } else {
      if (flight.ex_chkdone === 'DONE') {
          if (flight.tbrdbegin || flight.boarding) parts.push("Посадка");
      } else if (flight.checking) {
          parts.push("Регистрация");
      }
  }
  return parts.join(' ');
}

function getStatusArr(flight) {
  if (flight.timedelay && flight.time !== flight.timedelay) {
    if (flight.timedelay > flight.time) {
      let delayText = flight.codedelay ? flight.codedelay.replace(/[^а-яА-Яa-zA-Z0-9\s]/g, '').trim() : 'ЗАДЕРЖАН';
      return `${delayText} ${flight.timedelay}`;
    } else {
      return `ОЖИДАЕТСЯ В ${flight.timedelay}`;
    }
  }
  if (flight.tookoff) {
    if (flight.tookoff === 'ВЫЛ') return 'В ПУТИ';
    if (flight.tookoff === 'НЕВ') return 'НЕ ВЫЛЕТЕЛ';
  }
}

function normalizeFlight(raw, type) {
  const isDep = type === 'dep';
  const company = (raw.company || '').trim();
  const flightNum = (raw.flight || '').trim();
  return {
    time: (raw.time || '--:--').padEnd(COL_WIDTHS.time, ' '),
    dest: parseDestination(raw.dest),
    flight: (company + ' ' + flightNum).trim().padEnd(COL_WIDTHS.flight, ' '),
    gate: (isDep 
    ? ((raw.hall ? raw.hall + (raw.desk && raw.desk !== '-' ? '/' + raw.desk : '') : (raw.desk || '-'))) 
    : (raw.hall || '-')
).padEnd(COL_WIDTHS.gate, ' '),
    status: isDep ? getStatusDep(raw) : getStatusArr(raw),
    companyCode: company
  };
}

function getFlightKey(flight) {
  return `${flight.flight}|${flight.time}|${flight.dest}`;
}

async function fetchAndRender() {
  const statusEl = document.getElementById('connStatus');
  const container = document.getElementById('flights');
  try {
    if (!navigator.onLine) throw new Error('Нет подключения к сети');
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 10000);
    const [depRes, arrRes] = await Promise.all([
      fetch(URL_DEP, { signal: controller.signal }),
      fetch(URL_ARR, { signal: controller.signal })
    ]);
    clearTimeout(timeoutId);
    if (!depRes.ok || !arrRes.ok) throw new Error(`HTTP error`);
    
    const depData = await depRes.json();
    const arrData = await arrRes.json();

    const allFlights = [
        ...depData.map(d => ({...normalizeFlight(d, 'dep'), section: 'dep'})),
      ...arrData.map(d => ({...normalizeFlight(d, 'arr'), section: 'arr'}))
    ];

    const currentDataString = JSON.stringify(allFlights.map(f => ({
      f: f.flight, t: f.time, d: f.dest, s: f.status, g: f.gate
    })));

    if (previousFlightsData === currentDataString) return; 
    previousFlightsData = currentDataString;

    if (!isOnline) {
      isOnline = true;
      if (refreshInterval) clearInterval(refreshInterval);
      refreshInterval = setInterval(fetchAndRender, REFRESH_INTERVAL);
    }
    statusEl.textContent = 'ONLINE';
    statusEl.className = 'conn-status online';

    container.innerHTML = '';
    currentRows = [];
    let lastSection = null;
    let globalIndex = 0;

    allFlights.forEach((f) => {
      if (f.section !== lastSection) {
        const divider = document.createElement('div');
        divider.className = 'section-divider';
        divider.textContent = f.section === 'arr' ? 'ПРИЛЕТ' : 'ВЫЛЕТ';
        container.appendChild(divider);
        lastSection = f.section;
      }
      const rowObj = createRowElement();
      container.appendChild(rowObj.el);
      updateLogo(rowObj.logo, f.companyCode);
      
      rowObj.el.dataset.flightKey = getFlightKey(f);
      
      currentRows.push({ obj: rowObj, data: f });
      setTimeout(() => updateRowVisuals(rowObj, f), globalIndex * 40);
      globalIndex++;
    });
  } catch (err) {
    console.error('Ошибка:', err);
    statusEl.textContent = 'ERROR';
    statusEl.className = 'conn-status offline';
    isOnline = false;
    if (refreshInterval) { clearInterval(refreshInterval); refreshInterval = null; }
    clearTimeout(retryTimeout);
    retryTimeout = setTimeout(fetchAndRender, RETRY_DELAY);
  }
}

function updateRowVisuals(rowObj, data) {
  ['time','dest','flight','gate'].forEach(col => {
    const text = String(data[col] || '').toUpperCase();
    const padded = text.padEnd(COL_WIDTHS[col], ' ');
    rowObj.chars[col].forEach((cell, ci) => cell.spinTo(padded[ci]));
  });

  const statusText = String(data.status || '').toUpperCase();
  const wrapper = rowObj.statusWrap;
  const spans = wrapper.querySelectorAll('.status-text');
  
  const currentText = spans[0] ? spans[0].textContent.trim() : '';
  
  if (currentText !== statusText) {
      if (statusText.length > 15) {
        spans.forEach(span => span.textContent = statusText + '     ');
        wrapper.parentElement.classList.add('scrolling');
      } else {
        wrapper.parentElement.classList.remove('scrolling');
        if (spans[0]) spans[0].textContent = statusText;
        if (spans[1]) spans[1].textContent = '';
      }
  }
}

function updateClock() {
  const now = new Date();
  const dd = String(now.getDate()).padStart(2,'0');
  const mm = String(now.getMonth()+1).padStart(2,'0');
  const yy = String(now.getFullYear()).slice(-2);
  const hh = String(now.getHours()).padStart(2,'0');
  const mi = String(now.getMinutes()).padStart(2,'0');
  const ss = String(now.getSeconds()).padStart(2,'0');
  document.getElementById('datetime').textContent = `${dd}.${mm}.${yy}  ${hh}:${mi}:${ss}`;
}

async function init() {
  await loadLiveries();
  await loadWeather(); 
  setInterval(loadWeather, 900000); 
  
  setInterval(updateClock, 1000);
  updateClock();
  fetchAndRender();
}

init();
</script>
